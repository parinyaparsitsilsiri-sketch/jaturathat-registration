<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลงทะเบียนสำเร็จ 🙏</title>
<link rel="stylesheet" href="style.css">
<style>
  .success-wrap { text-align: center; padding: 60px 30px; }
  .success-icon { font-size: 80px; margin-bottom: 16px; animation: pop 0.5s ease; }
  @keyframes pop { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .success-wrap h2 { color: #1a4d2e; font-size: 26px; margin-bottom: 10px; }
  .success-wrap p { color: #444; font-size: 16px; line-height: 1.8; margin-bottom: 8px; }
  .success-wrap .course { font-weight: 700; color: #8c6e1a; font-size: 18px; margin: 12px 0; }
  .btn-ok { display: inline-block; margin-top: 22px; padding: 13px 44px; background: linear-gradient(135deg, #1a4d2e, #2e7d4f); color: #fff; text-decoration: none; border-radius: 30px; font-size: 16px; font-weight: 700; box-shadow: 0 4px 14px rgba(26,77,46,0.3); }
  .success-note { margin-top: 22px; font-size: 13px; color: #888; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <img src="logo.jpg" alt="โลโก้อาศรมศรีมงคล" class="header-logo">
    <h1>📝 ลงทะเบียนผู้เข้าอบรม</h1>
    <p>อาศรมศรีมงคล — หลักสูตรจตุรธาตุ ๒๓-๒๔ ตุลาคม ๒๕๖๙</p>
  </div>
  <div class="success-wrap">
    <div class="success-icon">✅</div>
    <h2>ลงทะเบียนสำเร็จ</h2>
    <p>
      🙏 ขอขอบคุณที่ให้ความสนใจเข้าร่วมอบรม<br>
      <span class="course">หลักสูตรจตุรธาตุ</span>
      ๒๓-๒๔ ตุลาคม ๒๕๖๙<br>
      อาศรมศรีมงคล
    </p>
    <a href="/" class="btn-ok">กลับหน้าหลัก</a>
    <div class="success-note">อาศรมศรีมงคล — ศูนย์การเรียนรู้การแพทย์แผนไทยและภูมิปัญญาไทย</div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Dashboard แบบสอบถาม — เส้นประธาน 10</title>
<style>
  :root { --teal:#005B41; --gold:#F0B414; --brown:#A05F37; --yellow:#FFDC00; --leaf:#96C82D; --white:#fff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Prompt","Noto Sans Thai","Sarabun",sans-serif; background:linear-gradient(135deg,#fdf8ec 0%,#f5ead3 100%); min-height:100vh; padding:20px; }
  .container { max-width:820px; margin:0 auto; background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 10px 40px rgba(0,91,65,.22); }
  .header { background:linear-gradient(135deg,var(--teal) 0%,#007a58 100%); color:#fff; text-align:center; padding:26px 20px; border-bottom:5px solid var(--gold); }
  .header h1 { font-size:22px; }
  .header p { font-size:13.5px; opacity:.95; margin-top:4px; }
  .body { padding:22px 26px; }
  .stat-cards { display:flex; gap:14px; margin-bottom:22px; }
  .card { flex:1; background:#f0faf3; border:1.5px solid #cde5d6; border-radius:14px; padding:16px; text-align:center; }
  .card .num { font-size:34px; font-weight:800; color:var(--teal); }
  .card .lbl { font-size:12.5px; color:#777; margin-top:2px; }
  .section-title { font-size:17px; font-weight:800; color:var(--teal); margin:22px 0 12px; padding-bottom:8px; border-bottom:2px solid var(--gold); }
  .q-row { margin-bottom:14px; }
  .q-label { font-size:13.5px; font-weight:600; color:#333; margin-bottom:6px; display:flex; justify-content:space-between; }
  .q-label .score { color:var(--teal); font-weight:800; }
  .bar-bg { background:#eef2ef; border-radius:8px; height:18px; overflow:hidden; }
  .bar { background:linear-gradient(90deg,var(--teal),#00a06f); height:100%; border-radius:8px; min-width:6px; transition:width .6s; }
  .sugg { background:#fff8e6; border-left:4px solid var(--gold); padding:10px 14px; border-radius:8px; margin-bottom:8px; font-size:13.5px; color:#555; }
  .empty { text-align:center; color:#999; padding:36px 0; font-size:15px; }
  .btn-refresh { position:fixed; right:22px; bottom:22px; background:var(--teal); color:#fff; border:none; border-radius:50%; width:52px; height:52px; font-size:20px; cursor:pointer; box-shadow:0 6px 18px rgba(0,91,65,.4); }
  .loading { text-align:center; color:#888; padding:40px 0; }
  .footer { background:var(--brown); color:#fff; text-align:center; padding:12px; font-size:12px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📊 Dashboard แบบสอบถามความพึงพอใจ</h1>
    <p>การตรวจวินิจฉัยอาการตามแนวเส้นประธาน 10 — 25-27 กันยายน 2569</p>
    <p>สมาคมแพทย์แผนไทย มหาวิทยาลัยสุโขทัยธรรมาธิราช</p>
  </div>
  <div class="body">
    <div id="content"><div class="loading">⏳ กำลังโหลดข้อมูล...</div></div>
  </div>
  <div class="footer">สมาคมแพทย์แผนไทย มสธ. | thaimedstou.com</div>
</div>
<button class="btn-refresh" onclick="load()">🔄</button>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzxZANlepalugXU1Grmk0WZVNd80PMZVe2Q3wP6mzXDArOuziyFaKAvEPD0aOCAHTsE/exec";
const QS = ["เนื้อหาหลักสูตร","วิทยากร","เอกสาร/สื่อประกอบ","สถานที่อบรม","ระยะเวลา/การจัดการ","อาหาร/เครื่องดื่ม","ทีมงาน/ผู้ช่วยวิทยากร","การนำไปใช้","ความพึงพอใจโดยรวม"];

async function load() {
  const c = document.getElementById("content");
  c.innerHTML = '<div class="loading">⏳ กำลังโหลดข้อมูล...</div>';
  try {
    const r1 = await fetch(WEB_APP_URL + "?action=surveyStats", { redirect: "manual" });
    if (r1.status === 302) {
      const loc = r1.headers.get("location");
      const res = await fetch(loc);
      render(await res.json());
      return;
    }
    render(await r1.json());
  } catch (e) {
    c.innerHTML = '<div class="empty">❌ โหลดข้อมูลไม่สำเร็จ: ' + e.message + '</div>';
  }
}

function render(d) {
  const c = document.getElementById("content");
  if (!d || d.total === 0) {
    c.innerHTML = '<div class="empty">📭 ยังไม่มีผู้ตอบแบบสอบถาม</div>';
    return;
  }
  let html = '<div class="stat-cards">' +
    '<div class="card"><div class="num">' + d.total + '</div><div class="lbl">ผู้ตอบทั้งหมด</div></div>' +
    '<div class="card"><div class="num">' + (d.avg.reduce((a,b)=>a+Number(b),0)/9).toFixed(2) + '</div><div class="lbl">คะแนนเฉลี่ยโดยรวม</div></div>' +
    '<div class="card"><div class="num">' + (d.dist[8] ? d.dist[8][4] : 0) + '</div><div class="lbl">ให้ 5 ดาว (Q9)</div></div>' +
    '</div>';
  html += '<div class="section-title">📋 คะแนนเฉลี่ยรายข้อ</div>';
  QS.forEach((q, i) => {
    const s = Number(d.avg[i] || 0);
    html += '<div class="q-row"><div class="q-label"><span>' + (i+1) + '. ' + q + '</span><span class="score">' + s.toFixed(2) + ' / 5</span></div>' +
      '<div class="bar-bg"><div class="bar" style="width:' + (s/5*100) + '%"></div></div></div>';
  });
  if (d.suggestions && d.suggestions.length) {
    html += '<div class="section-title">💬 ข้อเสนอแนะ (' + d.suggestions.length + ')</div>';
    d.suggestions.forEach(s => { html += '<div class="sugg">💭 ' + s + '</div>'; });
  }
  c.innerHTML = html;
}

load();
</script>
</body>
</html>

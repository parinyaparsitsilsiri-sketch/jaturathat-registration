<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ลงทะเบียนสำเร็จ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Sarabun,system-ui,sans-serif;background:#F4F8F4;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
.box{background:#fff;border-radius:20px;padding:34px 24px;max-width:460px;box-shadow:0 6px 24px rgba(0,0,0,.1)}
.ic{width:84px;height:84px;border-radius:50%;background:#E8F5E9;color:#2E7D32;font-size:44px;line-height:84px;margin:0 auto 18px}
h1{color:#1B5E20;font-size:23px;margin:0 0 10px}
p{color:#456045;font-size:16px;line-height:1.7;margin:0 0 8px}
small{color:#7A8A7A;font-size:14px;display:block;margin-top:16px}
</style></head>
<body><div class="box">
<div class="ic">✓</div>
<h1>ลงทะเบียนสำเร็จ</h1>
<p>ขอบคุณที่ลงทะเบียนเข้าอบรม<br><b>หลักสูตรจตุรธาตุ ๒๓–๒๔ ตุลาคม ๒๕๖๙</b></p>
<p>อาศรมศรีมงคลจะติดต่อกลับตามช่องทางที่ท่านให้ไว้</p>
<small>สามารถปิดหน้านี้ได้</small>
</div></body></html>
